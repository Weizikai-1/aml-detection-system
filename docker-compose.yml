# AML-Agent 反洗钱分析系统 - Docker Compose 编排
# 符合生产环境部署规范，支持数据持久化和服务编排

version: '3.8'

services:
  # ===== PostgreSQL 数据库 =====
  postgres:
    image: postgres:15-alpine
    container_name: aml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aml_db}
      POSTGRES_USER: ${POSTGRES_USER:-aml_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 数据库编码（支持中文）
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      # 数据持久化
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本（首次启动时执行）
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aml_user} -d ${POSTGRES_DB:-aml_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aml-network

  # ===== Redis 缓存与任务队列 =====
  redis:
    image: redis:7-alpine
    container_name: aml-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      # 数据持久化
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aml-network

  # ===== AML-Agent 应用服务 =====
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aml-app
    restart: unless-stopped
    environment:
      # 数据库连接
      DATABASE_URL: postgresql://${POSTGRES_USER:-aml_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aml_db}
      # Redis 连接
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # LLM API 配置（从环境变量注入）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # 应用配置
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # JWT 密钥（必须设置，无默认值）
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # 加密密钥（必须设置，无默认值）
      ENCRYPT_KEY: ${ENCRYPT_KEY}
      # 监控
      PROMETHEUS_PORT: 9090
    volumes:
      # 数据目录挂载（符合 M1: 使用真实数据）
      - ./data:/app/data:rw
      # 报告目录
      - ./reports:/app/reports:rw
      # 日志目录
      - ./logs:/app/logs:rw
    # 端口仅在内部网络暴露（通过 Nginx 反向代理对外提供 HTTPS）
    expose:
      - "8000"
      - "8501"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - aml-network

  # ===== Celery Worker（异步任务处理） =====
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aml-worker
    restart: unless-stopped
    command: celery -A api.celery_app worker --loglevel=info --concurrency=2
    environment:
      # 继承 app 服务的环境变量
      DATABASE_URL: postgresql://${POSTGRES_USER:-aml_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aml_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data:rw
      - ./reports:/app/reports:rw
      - ./logs:/app/logs:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aml-network

  # ===== Nginx 反向代理（HTTPS/TLS终止） =====
  nginx:
    image: nginx:1.27-alpine
    container_name: aml-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aml-network

# ===== 数据卷定义 =====
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ===== 网络定义 =====
networks:
  aml-network:
    driver: bridge